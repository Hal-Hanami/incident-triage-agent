name: tests

# The offline suite (fakes; no key, no network) — the same 286 tests the README
# claims. CI exists so that claim is third-party verifiable, not self-reported.
#
# The checks after the suite exist because the defects this project has actually
# shipped were not failures of the tests but gaps in their reach: the CLI module
# sat at 17% coverage while nothing verified that `--no-draft` withheld the Opus
# drafter, and two of the design's sections were cited by no test at all. A green
# suite is evidence about the code it touches and nothing more, so the build also
# fails when a module is unreached, when a design section is unpinned, when the
# docs quote a stale count, or when a reference points at nothing.
#
# The `agent` extra is installed so the SDK contract test runs here rather than
# skipping: every §9 guardrail is a keyword argument to that package's dataclass,
# and a rename upstream must fail the build rather than a paid run. Streamlit
# comes from requirements.txt — the same file the public deploy installs — so the
# hosted page is exercised against the dependency it is actually served with.
#
# The five that still skip compare the stand-in rag package with the real one, and
# no runner has a tech-docs-rag checkout beside this repo; enforcing that surface
# is the job of the repository that owns it, whose `tests/test_public_api.py`
# fails when it moves.
#
# `pip install -e` rather than `uv sync`: uv.lock is not committed, and the
# offline core is stdlib-only, so there is nothing to pin.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e '.[dev,agent]' pytest-cov -r requirements.txt

      # `--cov=app` too: the hosted page is the surface most readers see, so
      # leaving it outside the measurement would reopen exactly the gap these
      # checks exist to close.
      - name: suite and coverage
        run: >
          python -m pytest -q --cov=triage --cov=app --cov-report=term-missing
          --cov-report=json --cov-fail-under=90

      - name: every module must be reached by at least one test
        run: |
          python - <<'PY'
          import json, sys
          files = json.load(open("coverage.json"))["files"]
          unreached = sorted(f for f, d in files.items()
                             if d["summary"]["percent_covered"] == 0)
          if unreached:
              sys.exit("no test reaches: " + ", ".join(unreached))
          print(f"all {len(files)} modules are reached")
          PY

      - name: the count the docs quote must be the count that ran
        run: |
          n=$(python -m pytest --collect-only -q | tail -1 | grep -oE '^[0-9]+')
          for f in README.md docs/EVALUATION.md .github/workflows/ci.yml; do
            grep -q "$n tests" "$f" || { echo "$f does not say '$n tests'"; exit 1; }
          done
          echo "docs and suite agree: $n tests"

      - name: every section of the design must be pinned by a test
        run: |
          python - <<'PY'
          import pathlib, re, sys
          design = pathlib.Path("docs/design.md").read_text(encoding="utf-8")
          sections = re.findall(r"^## §(\d+)\s", design, re.M)
          if not sections:
              sys.exit("docs/design.md declares no numbered sections")
          tests = "\n".join(p.read_text(encoding="utf-8")
                            for p in pathlib.Path("tests").glob("*.py"))
          # citing §4.3 counts as citing §4 — a subsection belongs to its section
          unpinned = [n for n in sections if not re.search(rf"§{n}(?!\d)", tests)]
          if unpinned:
              sys.exit("no test cites design " + ", ".join(f"§{n}" for n in unpinned)
                       + " — a written rule nobody checks is one the next change breaks")
          print(f"all {len(sections)} design sections are pinned by a test")
          PY

      - name: every section reference must resolve inside this repository
        run: |
          python - <<'PY'
          import pathlib, re, subprocess, sys
          design = pathlib.Path("docs/design.md").read_text(encoding="utf-8")
          defined = {int(n) for n in re.findall(r"^## §(\d+)\s", design, re.M)}
          tracked = subprocess.run(["git", "ls-files"], capture_output=True,
                                   text=True, check=True).stdout.split()
          # A reader can only resolve a section number this repository defines.
          # Numbers pointing at an outside plan are the class of reference that
          # survives a repo being rebuilt, precisely because nothing fails on them.
          dangling = []
          for rel in tracked:
              try:
                  text = pathlib.Path(rel).read_text(encoding="utf-8")
              except (UnicodeDecodeError, IsADirectoryError, FileNotFoundError):
                  continue
              for n in sorted({int(m) for m in re.findall(r"§(\d+)", text)}):
                  if n not in defined:
                      dangling.append(f"{rel}: §{n}")
          if dangling:
              sys.exit("reference to a section docs/design.md does not define:\n  "
                       + "\n  ".join(dangling))
          print(f"every § reference resolves to one of {len(defined)} defined sections")
          PY

      - name: the repository must describe the system and nothing else
        run: |
          python - <<'PY'
          import pathlib, re, subprocess, sys
          # This repository is written for a reader who has never met its author,
          # so it documents the system and not the plans around it. Two rules,
          # each from something that reached a published file: the documentation
          # is English throughout (the author's working notes are not, and a
          # stray line of them is the clearest sign a private note leaked), and
          # no text may carry planning or hiring vocabulary — a design section
          # once closed by naming which hiring targets would care about it.
          #
          # The sweep reads every tracked file. The version that filtered by
          # extension is the one that missed a JSON file.
          JAPANESE = re.compile(r"[\u3040-\u309f\u30a0-\u30ff]")
          PLANNING = re.compile(
              r"pillar|recruiter|portfolio|talking point|targets? [ABC]\b|\bM[1-9]\b",
              re.I)
          tracked = subprocess.run(["git", "ls-files"], capture_output=True,
                                   text=True, check=True).stdout.split()
          hits = []
          for rel in tracked:
              try:
                  lines = pathlib.Path(rel).read_text(encoding="utf-8").splitlines()
              except (UnicodeDecodeError, IsADirectoryError, FileNotFoundError):
                  continue
              own = rel == ".github/workflows/ci.yml"  # has to spell what it bans
              for i, line in enumerate(lines, 1):
                  if JAPANESE.search(line) or (PLANNING.search(line) and not own):
                      hits.append(f"{rel}:{i}: {line.strip()[:100]}")
          if hits:
              sys.exit("these read as the author's context, not the system's:\n  "
                       + "\n  ".join(hits))
          print(f"swept {len(tracked)} tracked files")
          PY

      - name: the fixtures the numbers are measured over must be valid
        run: python -m triage validate
